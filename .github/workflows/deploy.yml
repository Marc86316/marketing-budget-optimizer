name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# 💡 依照 GitHub 2026 最新規範：強制將所有內建 Actions 升級以 Node 24 執行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 💡 這裡同步切換至 Node 24
          cache: 'npm'

      - name: Install dependencies 🛠️
        run: npm ci

      - name: Build project 🚀
        run: npm run build

      - name: Setup Pages 🌐
        uses: actions/configure-pages@v5 # 💡 升級至 v5 以完美支援新版環境

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4