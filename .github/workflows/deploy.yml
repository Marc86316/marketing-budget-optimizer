name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 💡 當 main 分支有新的 push 時，自動觸發這個機器人

# 設定機器人的權限，允許它讀取原始碼並寫入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同時有多個推播時，排隊執行，避免衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📥 (複製原始碼到雲端機器人)
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢 (安裝 Node 環境)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies 🛠️ (安裝專案套件，含 Tailwind v4)
        run: npm ci

      - name: Build project 🚀 (執行 Vite 打包編譯)
        run: npm run build

      - name: Setup Pages 🌐 (配置 GitHub Pages 環境)
        uses: actions/configure-pages@v4

      - name: Upload artifact 📦 (打包編譯好的 dist 資料夾)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages 🚀 (正式發佈到線上網頁)
        id: deployment
        uses: actions/deploy-pages@v4